project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll
    - assets/
    - scripts/main.js
    - scripts/induccion-cadena.js

title: "Precálculo"

website:
  title: "Precálculo"
  navbar:
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Inducción matemática"
        href: temas/induccion.qmd
      - text: "Sucesiones y sumatorias"
        href: temas/sucesiones-sumatorias.qmd
      - text: "Progresiones"
        href: temas/progresiones.qmd
  page-footer:
    left: "Precálculo"
    right: "Sitio académico generado con Quarto"

lang: es
bibliography: referencias.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "Contenido"
    css: styles/custom.css
    include-after-body:
      text: |
        <script>
        (() => {
          const cssHref = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
            .map((link) => link.getAttribute("href") || "")
            .find((href) => href.endsWith("styles/custom.css"));
          const basePath = cssHref ? cssHref.replace(/styles\/custom\.css$/, "") : "";
          const script = document.createElement("script");
          script.src = `${basePath}scripts/main.js`;
          script.defer = true;
          document.body.appendChild(script);
        })();
        </script>
